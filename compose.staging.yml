services:
  db:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: compensa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: compensa
    volumes:
      - compensa_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compensa -d compensa"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  app:
    build:
      context: .
      target: runner
    image: compensa-staging:local
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${COMPENSA_PORT:-3100}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    profiles: ["ops"]
    build:
      context: .
      target: tools
    image: compensa-staging-tools:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["npm", "run", "db:migrate"]
    networks:
      - backend

  bootstrap:
    profiles: ["ops"]
    build:
      context: .
      target: tools
    image: compensa-staging-tools:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      COMPENSA_ADMIN_EMAIL: ${COMPENSA_ADMIN_EMAIL:?COMPENSA_ADMIN_EMAIL is required}
      COMPENSA_ADMIN_PASSWORD: ${COMPENSA_ADMIN_PASSWORD:?COMPENSA_ADMIN_PASSWORD is required}
      COMPENSA_ADMIN_NAME: ${COMPENSA_ADMIN_NAME:-Compensa Admin}
      COMPENSA_ORG_SLUG: ${COMPENSA_ORG_SLUG:-compensa-staging}
      COMPENSA_ORG_NAME: ${COMPENSA_ORG_NAME:-Compensa Staging}
    command: ["npm", "run", "bootstrap:admin"]
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  compensa_pgdata:
