name: Temporary spreadsheet lock preparation

on:
  push:
    branches: [feat/spreadsheet-imports]
    paths:
      - .github/workflows/prepare-spreadsheet-lock-temporary.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/spreadsheet-imports
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Harden physical worksheet bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/application/spreadsheet-import.ts')
          text = path.read_text()
          old = '''  const rowCount = worksheet.actualRowCount ?? worksheet.rowCount;
  const columnCount = worksheet.actualColumnCount ?? worksheet.columnCount;
  if (rowCount > MAX_SPREADSHEET_ROWS + 1) throw new SpreadsheetImportError("SPREADSHEET_TOO_MANY_ROWS", `La hoja supera ${MAX_SPREADSHEET_ROWS} filas de datos.`);
  if (columnCount > MAX_SPREADSHEET_COLUMNS) throw new SpreadsheetImportError("SPREADSHEET_TOO_MANY_COLUMNS", `La hoja supera ${MAX_SPREADSHEET_COLUMNS} columnas.`);'''
          new = '''  const rowCount = Math.max(worksheet.actualRowCount ?? 0, worksheet.rowCount);
  const columnCount = Math.max(worksheet.actualColumnCount ?? 0, worksheet.columnCount);
  if (rowCount > MAX_SPREADSHEET_ROWS + 1) throw new SpreadsheetImportError("SPREADSHEET_TOO_MANY_ROWS", `La hoja supera ${MAX_SPREADSHEET_ROWS} filas de datos.`);
  if (columnCount > MAX_SPREADSHEET_COLUMNS) throw new SpreadsheetImportError("SPREADSHEET_TOO_MANY_COLUMNS", `La hoja supera ${MAX_SPREADSHEET_COLUMNS} columnas.`);'''
          if old not in text:
              raise SystemExit('worksheet bound block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Update npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/spreadsheet-import.ts package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Lock spreadsheet parser and harden XLSX bounds"
          git push origin HEAD:feat/spreadsheet-imports
