name: Temporary spreadsheet lock preparation

on:
  push:
    branches: [feat/spreadsheet-imports]
    paths:
      - .github/workflows/prepare-spreadsheet-lock-temporary.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/spreadsheet-imports
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Update npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "Lock spreadsheet parser dependency"
          git push origin HEAD:feat/spreadsheet-imports
