name: Temporary spreadsheet hardening

on:
  push:
    branches: [feat/spreadsheet-imports]
    paths:
      - .github/workflows/prepare-spreadsheet-lock-temporary.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/spreadsheet-imports
      - name: Harden physical worksheet bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/application/spreadsheet-import.ts')
          text = path.read_text()
          old_row = '  const rowCount = worksheet.actualRowCount ?? worksheet.rowCount;'
          new_row = '  const rowCount = Math.max(worksheet.actualRowCount ?? 0, worksheet.rowCount);'
          old_col = '  const columnCount = worksheet.actualColumnCount ?? worksheet.columnCount;'
          new_col = '  const columnCount = Math.max(worksheet.actualColumnCount ?? 0, worksheet.columnCount);'
          if old_row not in text or old_col not in text:
              raise SystemExit('worksheet bound lines not found')
          path.write_text(text.replace(old_row, new_row, 1).replace(old_col, new_col, 1))
          PY
      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/spreadsheet-import.ts
          git commit -m "Harden XLSX physical worksheet bounds"
          git push origin HEAD:feat/spreadsheet-imports
