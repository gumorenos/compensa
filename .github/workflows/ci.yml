name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://compensa:compensa@127.0.0.1:5432/compensa_test
      BETTER_AUTH_SECRET: ci-only-compensa-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: compensa
          POSTGRES_PASSWORD: compensa
          POSTGRES_DB: compensa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compensa -d compensa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build web application
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: PostgreSQL integration tests
        run: npm run test:integration
