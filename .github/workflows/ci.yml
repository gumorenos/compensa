name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://compensa:compensa@127.0.0.1:5432/compensa_test
      BETTER_AUTH_SECRET: ci-only-compensa-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: compensa
          POSTGRES_PASSWORD: compensa
          POSTGRES_DB: compensa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compensa -d compensa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build web application
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Verify migration-only command
        run: npm run db:migrate
      - name: Validate staging Compose file
        env:
          POSTGRES_PASSWORD: compensa
          COMPENSA_ADMIN_EMAIL: admin@example.com
          COMPENSA_ADMIN_PASSWORD: ci-only-admin-password
        run: >-
          docker compose -f compose.staging.yml --profile ops config >/dev/null
      - name: Build staging image
        run: docker build --target runner -t compensa-ci:latest .
      - name: Generate XLSX inside standalone image
        run: >-
          docker run --rm compensa-ci:latest
          node -e "import('@excel.js/exceljs').then(async (m) => { const Workbook = m.Workbook ?? m.default?.Workbook; if (typeof Workbook !== 'function') process.exit(1); const workbook = new Workbook(); const sheet = workbook.addWorksheet('QA'); sheet.addRow(['compensa', 1]); const bytes = await workbook.xlsx.writeBuffer(); if (!bytes || bytes.byteLength < 1000) process.exit(1); })"
      - name: Smoke-test staging container
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d \
            --network host \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /app/.next/cache \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            -e BETTER_AUTH_URL="http://127.0.0.1:3200" \
            -e PORT=3200 \
            -e HOSTNAME=0.0.0.0 \
            compensa-ci:latest)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          health=""
          for _ in $(seq 1 30); do
            health="$(curl -sS -o /tmp/compensa-health.json -w '%{http_code}' http://127.0.0.1:3200/api/health || true)"
            if [ "$health" = "200" ]; then
              break
            fi
            sleep 1
          done

          test "$health" = "200"
          grep -q '"status":"ok"' /tmp/compensa-health.json

          root_status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3200/)"
          test "$root_status" = "307"
      - name: Browser E2E - local AI assistance
        shell: bash
        env:
          BETTER_AUTH_URL: http://127.0.0.1:3210
          COMPENSA_AI_FIXTURE_ENABLED: "true"
          COMPENSA_E2E_ALLOW_DESTRUCTIVE_SEED: "true"
          COMPENSA_E2E_FIXTURE_PATH: /tmp/compensa-ai-e2e-fixture.json
          COMPENSA_E2E_BASE_URL: http://127.0.0.1:3210
          COMPENSA_E2E_CDP_URL: http://127.0.0.1:9222
        run: |
          set -euo pipefail

          if env -u COMPENSA_E2E_ALLOW_DESTRUCTIVE_SEED npm run test:e2e:seed >/tmp/compensa-e2e-seed-guard.log 2>&1; then
            echo "Destructive E2E seed ran without explicit opt-in." >&2
            exit 1
          fi
          if DATABASE_URL="postgres://compensa:compensa@127.0.0.1:5432/compensa" npm run test:e2e:seed >/tmp/compensa-e2e-db-guard.log 2>&1; then
            echo "Destructive E2E seed accepted a non-test database name." >&2
            exit 1
          fi

          npm run test:e2e:seed

          e2e_cid="$(docker run -d \
            --network host \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /app/.next/cache \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            -e BETTER_AUTH_URL="$BETTER_AUTH_URL" \
            -e COMPENSA_AI_FIXTURE_ENABLED="$COMPENSA_AI_FIXTURE_ENABLED" \
            -e PORT=3210 \
            -e HOSTNAME=0.0.0.0 \
            compensa-ci:latest)"

          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --disable-component-update \
            --disable-default-apps \
            --disable-sync \
            --metrics-recording-only \
            --no-first-run \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/compensa-e2e-chrome \
            about:blank >/tmp/compensa-e2e-chrome.log 2>&1 &
          chrome_pid=$!

          cleanup() {
            echo '--- Compensa E2E container log ---'
            docker logs "$e2e_cid" || true
            echo '--- Chrome E2E log ---'
            cat /tmp/compensa-e2e-chrome.log || true
            kill "$chrome_pid" >/dev/null 2>&1 || true
            docker rm -f "$e2e_cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3210/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3210/api/health | grep -q '"status":"ok"'

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          npm run test:e2e:ai
