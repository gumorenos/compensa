name: Temporary spreadsheet type fixes

on:
  push:
    branches: [feat/spreadsheet-imports]
    paths:
      - .github/workflows/fix-spreadsheet-types-temporary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/spreadsheet-imports
      - name: Apply strict accumulator and buffer fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/application/spreadsheet-import.ts')
          text = path.read_text()
          replacements = {
              '    justification?: string | null;': '    justification: string | null | undefined;',
              '    partition?: GoldStandardPartition;': '    partition: GoldStandardPartition | undefined;',
              '    isAnchor?: boolean;': '    isAnchor: boolean | undefined;',
              '    jobCode?: string | null;': '    jobCode: string | null | undefined;',
              '    department?: string | null;': '    department: string | null | undefined;',
              '    area?: string | null;': '    area: string | null | undefined;',
              '    jobFamily?: string | null;': '    jobFamily: string | null | undefined;',
              '    description?: string | null;': '    description: string | null | undefined;',
              '    expectedTotalPoints?: number;': '    expectedTotalPoints: number | undefined;',
              '    expectedGradeCode?: string;': '    expectedGradeCode: string | undefined;',
              '    notes?: string | null;': '    notes: string | null | undefined;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing accumulator pattern: {old}')
              text = text.replace(old, new, 1)

          old_init = '''      item = {
        caseCode,
        anonymizedLabel: label,
        methodologyVersionId: methodologyId,
        jobName,
        decisions: new Map(),
      };'''
          new_init = '''      item = {
        caseCode,
        anonymizedLabel: label,
        methodologyVersionId: methodologyId,
        partition: undefined,
        isAnchor: undefined,
        jobCode: undefined,
        jobName,
        department: undefined,
        area: undefined,
        jobFamily: undefined,
        description: undefined,
        expectedTotalPoints: undefined,
        expectedGradeCode: undefined,
        notes: undefined,
        decisions: new Map(),
      };'''
          if old_init not in text:
              raise SystemExit('missing case accumulator initializer')
          path.write_text(text.replace(old_init, new_init, 1))

          template = Path('src/application/spreadsheet-templates.ts')
          t = template.read_text()
          old_buffer = '''  const body = buffer instanceof Uint8Array
    ? new Uint8Array(buffer)
    : buffer instanceof ArrayBuffer
      ? new Uint8Array(buffer)
      : new Uint8Array(buffer.buffer, buffer.byteOffset, buffer.byteLength);'''
          new_buffer = '''  const body = buffer instanceof ArrayBuffer
    ? new Uint8Array(buffer)
    : new Uint8Array(buffer);'''
          if old_buffer not in t:
              raise SystemExit('missing template buffer block')
          template.write_text(t.replace(old_buffer, new_buffer, 1))
          PY
      - name: Commit type fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/spreadsheet-import.ts src/application/spreadsheet-templates.ts
          git commit -m "Fix strict spreadsheet adapter types"
          git push origin HEAD:feat/spreadsheet-imports
