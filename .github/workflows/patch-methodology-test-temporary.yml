name: Temporary methodology test patch

on:
  push:
    branches: [feat/methodology-admin]
    paths:
      - .github/workflows/patch-methodology-test-temporary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/methodology-admin
      - name: Update migration expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/persistence.test.ts')
          text = path.read_text()
          old = '''    expect(result.rows).toHaveLength(4);
              expect(result.rows.map((row) => row.name)).toEqual([
                "0001_core.sql",
                "0002_descriptions_evidence_review.sql",
                "0003_auth_rbac_audit.sql",
                "0004_gold_standard.sql",
              ]);'''.replace('              ', '    ')
          new = '''    expect(result.rows).toHaveLength(5);
              expect(result.rows.map((row) => row.name)).toEqual([
                "0001_core.sql",
                "0002_descriptions_evidence_review.sql",
                "0003_auth_rbac_audit.sql",
                "0004_gold_standard.sql",
                "0005_methodology_immutability.sql",
              ]);'''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('expected migration assertion block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/persistence.test.ts
          git commit -m "Expect methodology immutability migration"
          git push origin HEAD:feat/methodology-admin
